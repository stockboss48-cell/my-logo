<!-- WinzoNow Logo in HTML -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WinzoNow Logo</title>
  <style>
    .logo {
      font-family: 'Segoe UI', sans-serif;
      font-weight: bold;
      font-size: 40px;
      color: #fff;
      background: linear-gradient(45deg, #ffcc00, #ff0066);
      padding: 10px 20px;
      border-radius: 10px;
      display: inline-block;
      text-shadow: 2px 2px #000;
    }
    body {
      background-color: #121212;
      display: flex;
      height: 100vh;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="logo">WinzoNow</div>
</body>
</html>
